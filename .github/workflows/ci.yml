name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --timeout=60

  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax
        run: python -m py_compile $(find src tests -name "*.py" -not -name "__init__.py")
        shell: bash

      - name: Check import consistency
        run: |
          python -c "
          import importlib, sys
          sys.path.insert(0, '.')
          modules = ['src.config', 'src.task_board', 'src.llm', 'src.accounting',
                     'src.budget', 'src.logging_config',
                     'src.roles.architect', 'src.roles.coder',
                     'src.roles.merge_coord', 'src.roles.reviewer',
                     'src.roles.tester', 'src.orchestrator']
          for mod in modules:
              try:
                  importlib.import_module(mod)
                  print(f'OK: {mod}')
              except Exception as e:
                  print(f'FAIL: {mod} - {e}')
                  sys.exit(1)
          print('All imports OK')
          "
